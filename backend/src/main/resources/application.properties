# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/jobtracker_db
spring.datasource.username=jobtracker_user
spring.datasource.password=jobtracker_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# AWS S3 Configuration (LocalStack)
aws.s3.endpoint=http://localhost:4566
aws.s3.region=us-east-1
aws.s3.access-key=test
aws.s3.secret-key=test
aws.s3.bucket-name=job-tracker-cvs